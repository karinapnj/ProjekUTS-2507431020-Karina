<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Karina Studio</title>
    <link rel="stylesheet" type="text/css" href="css/Style.css">
</head>

<body>
    <main class="halaman-auth">
        <section class="panel-artwork" aria-label="Arana Studio branding">
            <span class="bentuk bentuk-satu" aria-hidden="true"></span>
            <span class="bentuk bentuk-dua" aria-hidden="true"></span>
            <span class="bentuk bentuk-tiga" aria-hidden="true"></span>

            <div class="konten-artwork">
                <h2>Turn experiences into share-worthy creations.</h2>
                <p>Sign in to pick up your projects, collect inspiration, and show your craft to the Karina community.
                </p>

                <nav class="nav-sosial" aria-label="Karina Studio social media">
                    <a href="#instagram" aria-label="Karina Studio on Instagram">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                            focusable="false">
                            <rect x="3" y="3" width="18" height="18" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.5" cy="6.5" r="0.5" />
                        </svg>
                    </a>
                    <a href="#email" aria-label="Email Karina Studio">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                            focusable="false">
                            <rect x="3" y="5" width="18" height="14" rx="2" />
                            <path d="m3 7 9 6 9-6" />
                        </svg>
                    </a>
                </nav>
            </div>
        </section>

        <section class="panel-formulir">
            <header>
                <a href="#" class="logo">
                    <span class="logo-lambang" aria-hidden="true">K</span>
                    Karina Studio
                </a>
            </header>

            <section class="kotak-login" aria-labelledby="judul-masuk">
                <h1 id="judul-masuk">Sign in to Karina</h1>
                <p class="sub-judul">Welcome back. Pick up where you left off.</p>

                <button type="button" class="tombol tombol-google">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path fill="#4285F4"
                            d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.46a5.52 5.52 0 0 1-2.4 3.62v3h3.88c2.27-2.09 3.58-5.17 3.58-8.81z" />
                        <path fill="#34A853"
                            d="M12 24c3.24 0 5.96-1.07 7.94-2.91l-3.88-3c-1.07.72-2.45 1.15-4.06 1.15-3.12 0-5.77-2.11-6.71-4.95H1.28v3.1A12 12 0 0 0 12 24z" />
                        <path fill="#FBBC05"
                            d="M5.29 14.29A7.2 7.2 0 0 1 4.9 12c0-.8.14-1.57.39-2.29v-3.1H1.28A12 12 0 0 0 0 12c0 1.94.46 3.77 1.28 5.39l4.01-3.1z" />
                        <path fill="#EA4335"
                            d="M12 4.76c1.76 0 3.34.61 4.59 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 0 0 1.28 6.61l4.01 3.1C6.23 6.87 8.88 4.76 12 4.76z" />
                    </svg>
                    Sign in with Google
                </button>

                <p class="pemisah">or</p>

                <form action="#" method="post">
                    <div class="kelompok-input">
                        <label for="identitas">Email or Username</label>
                        <input type="text" id="identitas" name="identitas" class="kolom-input"
                            placeholder="you@example.com" autocomplete="username" required>
                    </div>

                    <div class="kelompok-input">
                        <div class="baris-label">
                            <label for="sandi">Password</label>
                            <a href="#lupa-sandi" class="tautan-lupa">Forgot Password?</a>
                        </div>
                        <input type="password" id="sandi" name="sandi" class="kolom-input"
                            placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <label class="opsi-ingat" for="ingat">
                        <input type="checkbox" id="ingat" name="ingat">
                        Remember Me
                    </label>

                    <button type="submit" class="tombol tombol-masuk">Sign In</button>
                </form>
            </section>

            <footer>
                <p>&copy; 2026 Karina Studio</p>
            </footer>
        </section>

    </main>
</body>

</html>
